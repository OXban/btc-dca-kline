<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>全球资产定投日线</title>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JS9MGLKGPB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JS9MGLKGPB');
  </script>
  <script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --card:#131b31; --line:#263150; --text:#eff4ff; --muted:#9cabc9; --accent:#f6a623; --up:#2fc88e; --down:#f05c6c; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft Yahei",sans-serif; color:var(--text); background:linear-gradient(135deg,#090d19,#111a33); }
    main { max-width:1160px; padding:28px 18px 44px; margin:auto; }
    h1 { font-size:28px; margin:0 0 7px; }
    .sub { margin:0 0 22px; color:var(--muted); }
    .panel { background:rgba(19,27,49,.94); border:1px solid var(--line); border-radius:16px; box-shadow:0 14px 38px #0003; }
    .controls { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)) auto; gap:14px; padding:18px; margin-bottom:16px; align-items:end; }
    label { display:grid; gap:7px; color:var(--muted); font-size:13px; }
    input, select { width:100%; border:1px solid #344365; border-radius:9px; padding:11px 12px; background:#0c1326; color:var(--text); font:inherit; }
    button { border:0; border-radius:9px; background:var(--accent); color:#181005; padding:12px 19px; font-weight:800; cursor:pointer; font-size:14px; }
    button:hover { filter:brightness(1.08); }
    .small-button { padding:11px 13px; white-space:nowrap; }
    .hidden { display:none; }
    .price-picker { grid-column:span 2; display:flex; flex-wrap:wrap; gap:8px; align-items:center; min-height:42px; }
    .price-picker input { width:145px; }.price-tag { padding:7px 9px; border:1px solid #5d4820; background:#251d0e; color:#ffd784; border-radius:999px; font-size:13px; }
    .price-tag button { padding:0 0 0 7px; color:#ffd784; background:transparent; font-size:15px; font-weight:400; }
    #chart { height:530px; }
    .chart-head { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:17px 18px 4px; }
    .chart-head strong { font-size:17px; }.status { color:var(--muted); font-size:13px; }
    .summary { display:grid; grid-template-columns:repeat(4,1fr); margin-top:16px; overflow:hidden; }
    .metric { padding:18px; border-right:1px solid var(--line); }.metric:last-child{border:0}
    .metric span { color:var(--muted); font-size:13px; display:block; margin-bottom:7px; }.metric strong { font-size:20px; }
    .profit { color:var(--up); }.loss { color:var(--down); }
    .note { font-size:12px; line-height:1.7; color:var(--muted); margin:16px 4px 0; }
    @media (max-width:700px) { .controls{grid-template-columns:1fr 1fr}.controls button{grid-column:1/-1}.summary{grid-template-columns:1fr 1fr}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)} #chart{height:420px} }
  </style>
</head>
<body>
  <main>
    <h1>全球资产定投日线</h1>
    <p class="sub">按日线收盘价模拟定投；图中的 <b>B</b> 是每一笔买入。</p>
    <section class="panel controls">
      <label>市场<select id="market"><option value="crypto" selected>币圈</option><option value="us">美股 / 指数</option><option value="kr">韩股 / 指数</option><option value="cn">A股 / 指数</option></select></label>
      <label id="asset-wrap">币种（输入代码）<input id="asset" list="asset-list" value="BTC" autocomplete="off" placeholder="例如 BTC、ETH、SOL" /><datalist id="asset-list"></datalist></label>
      <label>每次定投金额（<span id="currency-label">USDC</span>）<input id="amount" type="number" min="1" step="1" value="100" /></label>
      <label>开始日期（北京时间）<input id="start" type="date" /></label>
      <label>结束日期（北京时间）<input id="end" type="date" /></label>
      <label>定投方式<select id="mode"><option value="schedule" selected>按时间定投</option><option value="price">按价格定投</option></select></label>
      <label id="frequency-wrap">定投频率<select id="frequency"><option value="daily">每天</option><option value="weekly" selected>每周</option><option value="monthly">每月</option></select></label>
      <div id="target-wrap" class="price-picker hidden"><input id="target-price" aria-label="触发价格" type="number" min="1" step="1" placeholder="输入触发价格" /><button type="button" class="small-button" id="add-price">添加价格</button><div id="price-tags"></div></div>
      <button id="calculate">更新定投计划</button>
    </section>
    <section class="panel">
      <div class="chart-head"><strong id="chart-title">BTC/USDC · 日线</strong><span class="status" id="status">正在加载行情…</span></div>
      <div id="chart"></div>
    </section>
    <section class="panel summary">
      <div class="metric"><span>累计定投</span><strong id="invested">—</strong></div>
      <div class="metric"><span id="coin-label">累计 BTC</span><strong id="btc">—</strong></div>
      <div class="metric"><span>定投成本（平均买入价）</span><strong id="cost">—</strong></div>
      <div class="metric"><span>收益金额 / 收益率</span><strong id="profit">—</strong></div>
    </section>
    <p class="note">币圈日线使用 Binance 公共 API，并按 UTC+8 日线收盘价模拟；美股、韩股和 A 股合约仍使用 Hyperliquid 公共 API。可用市场会显示在候选列表。报价和定投金额统一以稳定币计。“按价格定投”可设置多个价格档位。本页面不含交易手续费、滑点、汇率与税费，仅供学习和记录，不构成投资建议。</p>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const marketConfig = {
      crypto: { currency:'USDT', label:'币种代码（Binance）', placeholder:'例如 BTC、ETH、SOL', candidates:[] },
      us: { currency:'USDC', label:'美股 / 指数合约', placeholder:'仅显示 Hyperliquid 提供的合约', candidates:['MU','AAPL','NVDA','MSFT','AMZN','GOOGL','META','TSLA','SPY','QQQ','DIA','GSPC','NDX','DJI','SOX'] },
      kr: { currency:'USDC', label:'韩股 / 指数合约', placeholder:'仅显示 Hyperliquid 提供的合约', candidates:['005930','SAMSUNG','000660','SKHYNIX','005380','HYUNDAI','KOSPI','KOSDAQ'] },
      cn: { currency:'USDC', label:'A股 / 指数合约', placeholder:'仅显示 Hyperliquid 提供的合约', candidates:['600519','KWEICHOW','000001','PINGAN','300750','CATL','SHCOMP','CSI300','SSE50'] }
    };
    const currency = () => marketConfig[$('market').value].currency;
    const fmtUsd = n => new Intl.NumberFormat('zh-CN',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n || 0);
    const assetCode = () => $('asset').value.trim().toUpperCase();
    const fmtCoin = n => (n || 0).toFixed(8) + ' ' + assetCode();
    const nowCst = new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
    const defaultStart = new Date(Date.now()-365*864e5+8*3600e3).toISOString().slice(0,10);
    $('start').value = defaultStart;
    $('end').value = nowCst;

    const chart = LightweightCharts.createChart($('chart'), {
      autoSize:true, layout:{background:{color:'#131b31'},textColor:'#b8c4df'}, grid:{vertLines:{color:'#202a45'},horzLines:{color:'#202a45'}},
      crosshair:{mode:LightweightCharts.CrosshairMode.Normal}, rightPriceScale:{borderColor:'#334365'}, timeScale:{borderColor:'#334365',timeVisible:false}
    });
    const candles = chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#2fc88e',downColor:'#f05c6c',borderUpColor:'#2fc88e',borderDownColor:'#f05c6c',wickUpColor:'#2fc88e',wickDownColor:'#f05c6c'});
    let candleData = [];
    let loadedAsset = 'BTC';
    const buyMarkers = LightweightCharts.createSeriesMarkers(candles, []);
    let priceLevels = [80000];
    let supportedAssets = new Set();
    let assetRegistry = new Map();
    let binanceAssets = new Set(['BTC','ETH','BNB','SOL','XRP','DOGE','ADA','AVAX','LINK','SUI']);

    function cstDate(ts) { return new Date((ts + 8*3600)*1000).toISOString().slice(0,10); }
    async function requestJson(url) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      try {
        const response = await fetch(url, {signal:controller.signal});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } finally { clearTimeout(timeout); }
    }
    async function getJson(url) {
      const urls = [url, `https://corsproxy.io/?url=${encodeURIComponent(url)}`, `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`];
      for (const source of urls) try { return await requestJson(source); } catch (e) { console.warn('行情请求失败', source, e); }
      throw new Error('行情服务暂时不可用');
    }
    async function binanceJson(path) {
      const bases = ['https://api.binance.com', 'https://data-api.binance.vision'];
      for (const base of bases) try { return await requestJson(base + path); } catch (e) { console.warn('Binance 行情请求失败', base, e); }
      throw new Error('Binance 行情服务暂时不可用');
    }
    async function hlInfo(body) {
      const response = await fetch('https://api.hyperliquid.xyz/info', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      if (!response.ok) throw new Error('Hyperliquid 行情服务暂时不可用');
      return response.json();
    }
    function registerAsset(name, dex = '') {
      const source = String(name);
      const raw = source.toUpperCase();
      const base = raw.includes(':') ? raw.split(':').at(-1) : raw;
      // HIP-3 日线接口要求传入 DEX:合约；主市场则直接传合约代码。
      const coin = dex && !source.toLowerCase().startsWith(`${dex.toLowerCase()}:`) ? `${dex}:${source}` : source;
      const item = { coin, symbol:base, dex };
      [raw, coin, base, `${base}-USDC`, `${base}/USDC`].forEach(alias => assetRegistry.set(alias, item));
      supportedAssets.add(coin);
    }
    function resolveAsset(value) {
      const raw = value.trim().toUpperCase();
      return assetRegistry.get(raw) || assetRegistry.get(raw.replace(/[-/]USDC$/, ''));
    }
    async function loadAssetList() {
      try {
        assetRegistry = new Map(); supportedAssets = new Set();
        const main = await hlInfo({type:'meta'});
        main.universe.forEach(asset => registerAsset(asset.name));
        // perpDexs 列出全部 HIP-3 Builder DEX；每个 DEX 需要单独读取 meta。
        const dexes = await hlInfo({type:'perpDexs'}).catch(() => []);
        // 已验证的 HIP-3 市场兜底：MU 在 xyz，QQQ 在 mkts。
        // 即使合约清单接口暂时异常，这两个合约仍可立即使用。
        const names = new Set(['xyz', 'mkts']);
        (Array.isArray(dexes) ? dexes : []).filter(Boolean).forEach(dex => {
          const name = typeof dex === 'string' ? dex : dex.name;
          if (name) names.add(name);
        });
        await Promise.allSettled([...names].map(async name => {
          const meta = await hlInfo({type:'meta', dex:name});
          (meta.universe || []).forEach(asset => registerAsset(asset.name, name));
        }));
        // API 清单响应偶发延迟时，保留已验证的常用合约映射，供用户立即使用。
        registerAsset('MU', 'xyz');
        registerAsset('QQQ', 'mkts');
        renderMarketAssets();
      } catch (e) { console.warn(e); }
      try {
        const info = await binanceJson('/api/v3/exchangeInfo');
        binanceAssets = new Set((info.symbols || [])
          .filter(item => item.status === 'TRADING' && item.quoteAsset === 'USDT' && item.isSpotTradingAllowed)
          .map(item => item.baseAsset));
        renderMarketAssets();
      } catch (e) { console.warn(e); }
    }
    function renderMarketAssets() {
      const market = $('market').value, config = marketConfig[market];
      const all = [...new Set([...assetRegistry.values()].map(item => item.symbol))].sort();
      const available = market === 'crypto' ? [...binanceAssets].sort() : config.candidates.filter(code => resolveAsset(code));
      $('asset-list').innerHTML = available.map(asset => `<option value="${asset}">${asset}/${config.currency}</option>`).join('');
      if (market !== 'crypto' && !available.length) $('status').textContent = 'Hyperliquid 暂未提供该市场的可用合约。';
      return available;
    }
    async function loadCandles() {
      $('status').textContent = '正在更新日线…';
      const requested = assetCode();
      const market = $('market').value;
      const config = marketConfig[market];
      if (market === 'crypto') {
        if (binanceAssets.size && !binanceAssets.has(requested)) throw new Error(`${requested} 不在 Binance 当前可交易的 USDT 币对中`);
        $('asset').value = requested;
        $('chart-title').textContent = `${requested}/USDT · 日线`;
        $('coin-label').textContent = `累计 ${requested}`;
        // Binance 的 timeZone=8 将日线切换为 UTC+8 边界，收盘价即北京时间日线收盘价。
        const rows = await binanceJson(`/api/v3/klines?symbol=${encodeURIComponent(requested + 'USDT')}&interval=1d&limit=1000&timeZone=8`);
        loadedAsset = `BINANCE:${requested}`;
        candleData = rows.map(row => ({time:cstDate(row[0] / 1000), open:+row[1], high:+row[2], low:+row[3], close:+row[4]}));
        if (!candleData.length) throw new Error(`${requested} 没有可用的 Binance 日线数据`);
        candles.setData(candleData); chart.timeScale().fitContent();
        $('status').textContent = `已更新 · Binance · ${new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai'})}（北京时间）`;
        return;
      }
      const item = resolveAsset(requested);
      if (supportedAssets.size && !item) throw new Error(`${requested} 不在 Hyperliquid 当前可用合约中`);
      if (!item) throw new Error('正在读取 Hyperliquid 合约列表，请稍后重试');
      $('asset').value = item.symbol;
      $('chart-title').textContent = `${item.symbol}/${config.currency} · 日线`;
      $('coin-label').textContent = `累计 ${item.symbol}`;
      const endTime = Date.now(), startTime = endTime - 1000 * 60 * 60 * 24 * 1000;
      const rows = await hlInfo({type:'candleSnapshot', req:{coin:item.coin, interval:'1d', startTime, endTime}});
      loadedAsset = item.coin;
      candleData = rows.map(row => ({ time:cstDate(row.t / 1000), open:+row.o, high:+row.h, low:+row.l, close:+row.c }));
      if (!candleData.length) throw new Error(`${requested} 没有可用的日线数据`);
      candles.setData(candleData);
      chart.timeScale().fitContent();
      $('status').textContent = `已更新 · ${new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai'})}（北京时间）`;
    }
    function isBuyDay(date, start, frequency) {
      const days = Math.floor((Date.parse(date+'T00:00:00+08:00') - Date.parse(start+'T00:00:00+08:00')) / 864e5);
      if (days < 0) return false;
      if (frequency === 'daily') return true;
      if (frequency === 'weekly') return days % 7 === 0;
      const d = new Date(date+'T00:00:00+08:00'), s = new Date(start+'T00:00:00+08:00');
      return d.getUTCDate() === s.getUTCDate() || (d.getUTCDate() < s.getUTCDate() && new Date(d.getTime()+864e5).getUTCMonth() !== d.getUTCMonth());
    }
    function calculate() {
      const amount = Number($('amount').value), start = $('start').value, end = $('end').value, frequency = $('frequency').value, mode = $('mode').value;
      if (!amount || amount <= 0 || !start || !end || start > end) return alert('请填写有效的金额、开始日期和结束日期。');
      if (mode === 'price' && !priceLevels.length) return alert('请至少添加一个触发价格。');
      let invested=0, acquired=0; const markers=[];
      const windowCandles = candleData.filter(d => d.time >= start && d.time <= end);
      if (mode === 'price') {
        for (const level of priceLevels) {
          const hit = windowCandles.find(d => d.close <= level);
          if (!hit) continue;
          invested += amount; acquired += amount / hit.close;
          markers.push({time:hit.time,position:'belowBar',color:'#f6a623',shape:'arrowUp',text:'B'});
        }
      } else for (const d of windowCandles) if (isBuyDay(d.time,start,frequency)) {
        invested += amount; acquired += amount / d.close;
        markers.push({time:d.time,position:'belowBar',color:'#f6a623',shape:'arrowUp',text:'B'});
      }
      const markerCounts = new Map();
      markers.forEach(marker => markerCounts.set(marker.time, (markerCounts.get(marker.time) || 0) + 1));
      buyMarkers.setMarkers([...markerCounts].map(([time, count]) => ({time, position:'belowBar', color:'#f6a623', shape:'arrowUp', text:count > 1 ? `B×${count}` : 'B'})));
      const price = candleData.at(-1)?.close || 0, value=acquired*price, pnl=value-invested, rate=invested ? pnl/invested*100 : 0;
      $('invested').textContent=fmtUsd(invested); $('btc').textContent=fmtCoin(acquired); $('cost').textContent=acquired ? fmtUsd(invested/acquired) : '—';
      const p=$('profit'); p.textContent=`${fmtUsd(pnl)} / ${rate.toFixed(2)}%`; p.className=pnl >= 0 ? 'profit' : 'loss';
      $('status').textContent += ` · ${markers.length} 笔${mode === 'price' ? '价格触发' : '定时'}定投`;
    }
    function updateMode() {
      const priceMode = $('mode').value === 'price';
      $('frequency-wrap').classList.toggle('hidden', priceMode);
      $('target-wrap').classList.toggle('hidden', !priceMode);
    }
    function setMarket() {
      const config = marketConfig[$('market').value];
      $('asset-wrap').firstChild.textContent = config.label;
      $('asset').placeholder = config.placeholder;
      $('currency-label').textContent = config.currency;
      const available = renderMarketAssets();
      $('asset').value = $('market').value === 'crypto' ? 'BTC' : (available[0] || '');
      priceLevels = []; renderPriceTags();
      if ($('asset').value) init();
    }
    function renderPriceTags() {
      $('price-tags').innerHTML = priceLevels.map((level, index) => `<span class="price-tag">${Number(level).toLocaleString('en-US')} <button type="button" data-index="${index}" aria-label="删除 ${level}">×</button></span>`).join('');
      $('price-tags').querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
        priceLevels.splice(Number(button.dataset.index), 1); renderPriceTags(); calculate();
      }));
    }
    function addPriceLevel() {
      const level = Number($('target-price').value);
      if (!level || level <= 0) return alert('请输入有效的触发价格。');
      if (!priceLevels.includes(level)) priceLevels.push(level);
      priceLevels.sort((a,b) => b-a); $('target-price').value = ''; renderPriceTags(); calculate();
    }
    async function init() { try { await loadCandles(); calculate(); } catch(e) { $('status').textContent=e.message + '，请稍后重试。'; console.error(e); } }
    $('calculate').addEventListener('click', () => {
      const market = $('market').value;
      const current = market === 'crypto' ? `BINANCE:${assetCode()}` : resolveAsset(assetCode())?.coin;
      current === loadedAsset ? calculate() : init();
    });
    $('add-price').addEventListener('click',addPriceLevel);
    $('target-price').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addPriceLevel(); } });
    $('mode').addEventListener('change', () => { updateMode(); calculate(); });
    $('asset').addEventListener('change', () => { priceLevels = []; renderPriceTags(); init(); });
    $('asset').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); priceLevels = []; renderPriceTags(); init(); } });
    $('market').addEventListener('change', setMarket);
    renderPriceTags(); updateMode();
    loadAssetList().then(init); setInterval(init, 60_000);
  </script>
</body>
</html>
